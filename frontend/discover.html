
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>Discover | ThoughtSnap</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d19;
      --card: #111a2c;
      --border: #25324a;
      --text: #f1f5f9;
      --muted: #9aa9c0;
      --blue: #60a5fa;
      --purple: #a78bfa;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px max(5%, calc((100% - 1000px) / 2));
      background: #0b1220;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    main {
      max-width: 760px;
      padding: 32px 16px 60px;
      margin: auto;
    }

    .heading {
      font-size: 30px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 9px;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--card);
      color: white;
    }

    .search-box input:focus {
      border-color: var(--blue);
    }

    .search-box button {
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: #08111f;
      font-weight: 800;
    }

    .section-title {
      margin: 30px 0 14px;
      font-size: 18px;
    }

    .results {
      display: grid;
      gap: 13px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #08111f;
      font-size: 22px;
      font-weight: 800;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .username {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .bio {
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
    }

    .follow-btn {
      min-width: 100px;
      padding: 10px 13px;
      border: 1px solid var(--blue);
      border-radius: 9px;
      background: var(--blue);
      color: #08111f;
      font-weight: 800;
    }

    .follow-btn.following {
      background: transparent;
      color: white;
      border-color: var(--border);
    }

    .profile-link {
      color: var(--blue);
      font-size: 12px;
      cursor: pointer;
    }

    .message {
      padding: 26px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .error {
      color: #fca5a5;
    }

    @media (max-width: 520px) {
      .navbar {
        padding: 15px;
      }

      .nav-links {
        gap: 12px;
        font-size: 12px;
      }

      .brand {
        font-size: 20px;
      }

      .heading {
        font-size: 26px;
      }

      .user-card {
        flex-wrap: wrap;
      }

      .user-actions {
        width: 100%;
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
      }

      .search-box button {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a class="brand" href="index.html">Thought<span>Snap</span></a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="profile.html">My Profile</a>
    </div>
  </nav>

  <main>
    <h1 class="heading">Discover people</h1>
    <p class="subtitle">
      Find people on ThoughtSnap and connect with their posts.
    </p>

    <form id="search-form" class="search-box">
      <input
        id="search-input"
        type="search"
        placeholder="Search by name or username..."
        maxlength="50"
        autocomplete="off"
        required
      >
      <button type="submit">Search</button>
    </form>

    <h2 class="section-title">People</h2>

    <div id="results" class="results">
      <div class="message">
        Search for a name or username to get started.
      </div>
    </div>
  </main>

  <script>
    const API_BASE_URL = "http://localhost:5000/api";

    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const results = document.getElementById("results");

    let currentUserId = "";

    async function request(path, options = {}) {
      const response = await fetch(API_BASE_URL + path, {
        credentials: "include",
        ...options,
        headers: {
          ...(options.body ? {
            "Content-Type": "application/json"
          } : {}),
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request failed.");
      }

      return data;
    }

    function showMessage(message, isError = false) {
      results.replaceChildren();

      const element = document.createElement("div");
      element.className = "message" + (isError ? " error" : "");
      element.textContent = message;

      results.appendChild(element);
    }

    function getUserId(user) {
      return String(user.id || user._id || "");
    }

    function createUserCard(user) {
      const card = document.createElement("article");
      card.className = "user-card";

      const usernameValue = String(user.username || "").trim();

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = (
        user.name || usernameValue || "?"
      ).charAt(0).toUpperCase();

      const info = document.createElement("div");
      info.className = "user-info";

      const name = document.createElement("h3");
      name.className = "user-name";
      name.textContent = user.name || usernameValue || "User";

      const username = document.createElement("p");
      username.className = "username";
      username.textContent = "@" + (usernameValue || "user");

      const bio = document.createElement("p");
      bio.className = "bio";
      bio.textContent = user.bio || "No bio added yet.";

      info.append(name, username, bio);

      const actions = document.createElement("div");
      actions.className = "user-actions";

      const followButton = document.createElement("button");
      followButton.className = "follow-btn";
      followButton.type = "button";

      let isFollowing = Boolean(user.isFollowing);

      function updateFollowButton() {
        followButton.textContent = isFollowing
          ? "Following"
          : "Follow";

        followButton.classList.toggle("following", isFollowing);

        followButton.setAttribute(
          "aria-label",
          (isFollowing ? "Unfollow " : "Follow ") +
          (usernameValue || "user")
        );
      }

      updateFollowButton();

      const targetUserId = getUserId(user);

      if (!targetUserId || targetUserId === currentUserId) {
        followButton.hidden = true;
      }

      followButton.addEventListener("click", async () => {
        if (!targetUserId || targetUserId === currentUserId) {
          return;
        }

        followButton.disabled = true;

        try {
          const result = await request(
            "/users/" + encodeURIComponent(targetUserId) + "/follow",
            { method: "POST" }
          );

          isFollowing = Boolean(result.following);

          if (result.followersCount !== undefined) {
            user.followersCount = result.followersCount;
          }

          updateFollowButton();
        } catch (error) {
          alert(error.message || "Unable to update follow status.");
        } finally {
          followButton.disabled = false;
        }
      });

      const profileLink = document.createElement("a");
      profileLink.className = "profile-link";
      profileLink.textContent = "View profile";

      // Always create a profile URL using this card's username.
      const profileUrl = new URL("profile.html", window.location.href);
      profileUrl.searchParams.set("username", usernameValue);
      profileUrl.searchParams.set("source", "discover");

      profileLink.href = profileUrl.href;

      // Prevent opening a profile without a valid username.
      if (!usernameValue) {
        profileLink.removeAttribute("href");
        profileLink.style.opacity = "0.5";
        profileLink.style.pointerEvents = "none";
      }

      actions.append(followButton, profileLink);
      card.append(avatar, info, actions);

      return card;
    }

    async function searchUsers(query) {
      const cleanQuery = query.trim();

      if (!cleanQuery) {
        showMessage("Enter a name or username to search.");
        return;
      }

      showMessage("Searching...");

      try {
        const data = await request(
          "/users/search?q=" + encodeURIComponent(cleanQuery)
        );

        const users = Array.isArray(data.users)
          ? data.users
          : [];

        const visibleUsers = users.filter(user => {
          const userId = getUserId(user);
          return !userId || userId !== currentUserId;
        });

        if (visibleUsers.length === 0) {
          showMessage("No other users found. Try a different search.");
          return;
        }

        results.replaceChildren();

        visibleUsers.forEach(user => {
          results.appendChild(createUserCard(user));
        });
      } catch (error) {
        showMessage(
          error.message || "Could not search users. Check your connection.",
          true
        );
      }
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      searchUsers(searchInput.value);
    });

    async function init() {
      try {
        const data = await request("/auth/me");
        const user = data.user || data.data?.user;

        if (!user) {
          showMessage(
            "Please log in to discover and follow people.",
            true
          );
          return;
        }

        currentUserId = getUserId(user);
      } catch (error) {
        showMessage(
          "Please log in first. Your ThoughtSnap session could not be verified.",
          true
        );
      }
    }

    init();
  </script>
</body>
</html>
